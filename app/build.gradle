plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    namespace 'com.tfm.galifit'
    compileSdk 34

    defaultConfig {
        applicationId "com.tfm.galifit"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "ROUTINE_GENERATOR", "\"${localProperties.getProperty("ROUTINE_GENERATOR", "gemini")}\""
        buildConfigField "String", "EXERCISE_CATALOG_SOURCE", "\"${localProperties.getProperty("EXERCISE_CATALOG_SOURCE", "exercisedb")}\""
        buildConfigField "String", "DEEPL_API_KEY", "\"${localProperties.getProperty("DEEPL_API_KEY", "")}\""
        buildConfigField "String", "EDAMAM_APP_ID", "\"${localProperties.getProperty("EDAMAM_APP_ID", "")}\""
        buildConfigField "String", "EDAMAM_APP_KEY", "\"${localProperties.getProperty("EDAMAM_APP_KEY", "")}\""
        buildConfigField "String", "EDAMAM_ACCOUNT_USER", "\"${localProperties.getProperty("EDAMAM_ACCOUNT_USER", "")}\""

        buildConfigField "String", "GEMINI_PROJECT_ID", "\"${localProperties.getProperty("GEMINI_PROJECT_ID", "")}\""
        buildConfigField "String", "GEMINI_APP_ID", "\"${localProperties.getProperty("GEMINI_APP_ID", "")}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty("GEMINI_API_KEY", "")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.navigation:navigation-compose:2.8.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"

    implementation "androidx.navigation:navigation-fragment-ktx:2.8.0"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.0"

    implementation platform("com.google.firebase:firebase-bom:34.10.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-storage"
    implementation "com.google.firebase:firebase-messaging"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.14"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation 'androidx.test.ext:junit-ktx:1.3.0'

    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation "io.coil-kt:coil-compose:2.6.0"

    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    implementation "androidx.work:work-runtime-ktx:2.9.1"

    implementation "com.google.firebase:firebase-ai"

    implementation "androidx.health.connect:connect-client:1.1.0-alpha06"

    implementation "com.jakewharton.timber:timber:5.0.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.06.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation "androidx.viewpager2:viewpager2:1.1.0"

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    def fragment_version = "1.5.6"

    implementation "androidx.fragment:fragment:$fragment_version"

    implementation "androidx.fragment:fragment-ktx:$fragment_version"

}
